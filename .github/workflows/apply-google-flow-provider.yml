name: Apply Google Flow provider

on:
  push:
    branches:
      - agent/google-flow-video-provider

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/google-flow-video-provider
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply provider patch
        run: python3 scripts/apply-google-flow-provider.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Remove migration helpers
        run: rm scripts/apply-google-flow-provider.py .github/workflows/apply-google-flow-provider.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Google Flow video provider"
          git push origin HEAD:agent/google-flow-video-provider
