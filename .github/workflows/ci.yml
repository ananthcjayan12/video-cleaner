name: CI

on:
  pull_request:
  push:
    branches:
      - agent/video-cleaner-mvp

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: node --import tsx --test server/project-export.test.ts server/editor-render.test.ts src/workflow.test.ts
      - run: npm run typecheck
      - run: npm run build
